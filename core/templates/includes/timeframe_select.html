<label class="inline-flex items-center align-baseline not-italic font-normal">
  <span class="sr-only">Select timeframe</span>
  <span class="relative inline-flex items-center">
    <select
      data-timeframe-select
      aria-label="Select timeframe"
      onchange="const u=new URL(window.location.href);if(this.value==='90'){u.searchParams.delete('days');}else{u.searchParams.set('days',this.value);}u.searchParams.delete('page');window.location.href=u.toString();"
      class="appearance-none cursor-pointer rounded-md bg-zinc-800/90 hover:bg-zinc-800 border border-zinc-700/80 hover:border-emerald-500/50 text-emerald-400 font-semibold pl-2 pr-5 py-0.5 text-xs sm:text-sm shadow-xs transition-colors focus:outline-hidden focus:ring-1 focus:ring-emerald-400 focus:border-emerald-400"
    >
      <option value="30" class="bg-zinc-900 text-zinc-100 py-1" {% if TIMEFRAME == '30' %}selected{% endif %}>30 days</option>
      <option value="90" class="bg-zinc-900 text-zinc-100 py-1" {% if TIMEFRAME == '90' %}selected{% endif %}>90 days</option>
      <option value="180" class="bg-zinc-900 text-zinc-100 py-1" {% if TIMEFRAME == '180' %}selected{% endif %}>180 days</option>
      <option value="365" class="bg-zinc-900 text-zinc-100 py-1" {% if TIMEFRAME == '365' %}selected{% endif %}>365 days</option>
    </select>
    <svg class="pointer-events-none absolute right-1.5 h-3 w-3 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </span>
</label>
