{% extends "og/base_og.svg" %}

{% block badge %}
  <rect x="840" y="42" width="300" height="34" rx="17" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
  <text x="990" y="64" class="font-mono" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.08em">{{ format_name|upper }} 30-DAY REPORT</text>
{% endblock %}

{% block content %}
  <!-- Tournament Title & Meta -->
  <text x="60" y="136" class="font-sans" font-size="34" font-weight="800" fill="#ffffff">{{ format_name }} Tournaments</text>
  <text x="60" y="168" class="font-sans" font-size="16" fill="#a1a1aa">Challenge Top 8 Metagame • Last 30 Days</text>

  <!-- Summary Stats Pills -->
  <g transform="translate(60, 182)">
    <!-- Pill 1: Challenges -->
    <rect x="0" y="0" width="155" height="24" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="12" y="16" class="font-sans" font-size="11" font-weight="700" fill="#38bdf8">{{ chart.total_tournaments }} CHALLENGES</text>

    <!-- Pill 2: Total Top 8s -->
    <rect x="165" y="0" width="170" height="24" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="177" y="16" class="font-sans" font-size="11" font-weight="700" fill="#34d399">{{ chart.total_decks }} TOP 8 FINISHES</text>

    {% if top_archetype %}
    <!-- Pill 3: Top Archetype -->
    <rect x="345" y="0" width="340" height="24" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1" stroke-opacity="0.35"/>
    <text x="357" y="16" class="font-sans" font-size="11" font-weight="700" fill="#34d399">#1: {{ top_archetype.name }} ({{ top_archetype.total_count }} T8s • {{ top_archetype.share_pct }}%)</text>
    {% endif %}
  </g>

  <!-- Infographic Card Container -->
  <rect x="60" y="218" width="1080" height="358" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>

  <!-- Card Header with Legend -->
  <text x="80" y="244" class="font-mono" font-size="11" font-weight="700" fill="#71717a" letter-spacing="0.08em">ARCHETYPE BREAKDOWN • TOP 8 PLAY RATES &amp; FINISHES</text>

  <g transform="translate(945, 233)">
    <!-- 1st Place Legend -->
    <rect x="0" y="0" width="12" height="12" rx="2.5" fill="#f59e0b" stroke="#fbbf24" stroke-width="0.75"/>
    <text x="18" y="10" class="font-sans" font-size="11" fill="#fbbf24">1st</text>

    <!-- Top 8 Legend -->
    <rect x="50" y="0" width="12" height="12" rx="2.5" fill="#10b981" stroke="#34d399" stroke-width="0.75"/>
    <text x="68" y="10" class="font-sans" font-size="11" fill="#e4e4e7">Top 8</text>
  </g>

  <!-- Horizontal Divider Line -->
  <line x1="60" y1="256" x2="1140" y2="256" stroke="#27272a" stroke-width="1"/>

  <!-- Archetype Rows -->
  <g transform="translate(80, 278)">
    {% for row in rows %}
      <g transform="translate(0, {{ row.y_offset }})">
        <!-- Archetype Name -->
        <text x="0" y="11" class="font-sans" font-size="13" font-weight="700" fill="#ffffff">{{ row.name }}</text>

        <!-- Unit Blocks -->
        {% for u in row.units %}
          <rect x="{{ u.x }}" y="-2" width="14" height="14" rx="2.5" fill="{% if u.is_win %}#f59e0b{% else %}#10b981{% endif %}" stroke="{% if u.is_win %}#fbbf24{% else %}#34d399{% endif %}" stroke-width="0.75"/>
          {% if u.rank %}
            <text x="{{ u.text_x }}" y="9" class="font-mono" font-size="9" font-weight="800" fill="{% if u.is_win %}#451a03{% else %}#022c22{% endif %}" text-anchor="middle">{{ u.rank }}</text>
          {% endif %}
        {% endfor %}

        {% if row.overflow %}
          <rect x="{{ row.overflow.x }}" y="-2" width="28" height="14" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="0.75"/>
          <text x="{{ row.overflow.text_x }}" y="9" class="font-mono" font-size="8.5" font-weight="700" fill="#a1a1aa" text-anchor="middle">{{ row.overflow.label }}</text>
        {% endif %}

        <!-- Wins count if > 0 -->
        {% if row.wins_count > 0 %}
          <text x="875" y="11" class="font-mono" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="end">{{ row.wins_count }} Wins</text>
        {% endif %}

        <!-- Total Count & Share -->
        <text x="990" y="11" class="font-mono" font-size="11" fill="#a1a1aa" text-anchor="end">{{ row.total_count }} <tspan fill="#52525b">({{ row.share_pct }}%)</tspan></text>
      </g>
    {% endfor %}

    {% if remaining_archetypes > 0 %}
    <!-- Footer row inside card -->
    <text x="0" y="280" class="font-mono" font-size="10.5" fill="#71717a">+ {{ remaining_archetypes }} other archetypes ({{ remaining_decks }} Top 8s) • Full breakdown at modometa.com/{{ format_slug }}/tournaments/</text>
    {% endif %}
  </g>
{% endblock %}
