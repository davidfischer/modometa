# fly.toml app configuration file generated for modometa on 2026-09-09T00:39:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'modometa'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  CSRF_TRUSTED_ORIGINS = 'https://*.fly.dev,https://modometa.com,https://www.modometa.com'
  DATABASE_PATH = '/app/modometa.db'
  DJANGO_SETTINGS_MODULE = 'config.settings.prod'
  GUNICORN_MAX_REQUESTS = '1000'
  GUNICORN_MAX_REQUESTS_JITTER = '100'
  GUNICORN_THREADS = '4'
  GUNICORN_TIMEOUT = '60'
  GUNICORN_WORKERS = '1'
  KNN_INDEX_PATH = '/app/data/knn_index.npz'
  PORT = '8000'
  R2_PUBLIC_URL = 'https://data.modometa.com'
  SEARCH_INDEX_PATH = '/app/data/search_index.json'

[deploy]
  wait_timeout = "300s"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '180s'
    method = 'GET'
    path = '/healthz'

# https://fly.io/docs/machines/guides-examples/machine-sizing/
[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
