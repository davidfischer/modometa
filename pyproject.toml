[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "config"]

[project]
name = "modometa"
version = "0.1.0"
description = "Magic the Gathering Online Metagame Analyzer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2",
    "gunicorn>=23.0",
    "httpx>=0.28",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.15",
    "tqdm>=4.66",
    "whitenoise>=6.8",
]

[project.scripts]
modometa = "core.cli:main"


[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
extend-include = ["*.ipynb"]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Enable:
#  Pyflakes (`F`): https://docs.astral.sh/ruff/rules/#pyflakes-f
#  pycodestyle (`E`, `W`): https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
#  isort (`I`) import sorting: https://docs.astral.sh/ruff/rules/#isort-i
#  flake8-bandit (`S`) security checks: https://docs.astral.sh/ruff/rules/#flake8-bandit-s
select = ["E", "W", "F", "I", "S"]

[tool.ruff.lint.isort]
# https://docs.astral.sh/ruff/settings/#lintisort
force-single-line = true
case-sensitive = false
lines-after-imports = 2

# Ignore `F405` (import *) in config files
[tool.ruff.lint.per-file-ignores]
# Ignore line-too-long. Using ruff for formatting
"*" = ["E501"]
# Ignore security checks in tests
"**/tests.py" = ["S"]
"**/tests/*.py" = ["S"]
"**/test_*.py" = ["S"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py", "tests.py"]
